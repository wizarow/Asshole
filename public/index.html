<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Asshole Card Game</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E9EBEE">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#E9EBEE;--lite:#F6F7F9;--ink:#101522;--gray:#4A5062;--or:#F25C1F;--on-or:#101522;--rust:#B83600;--red:#C42A18;--ok:#2E7D32;--fs:16px;color-scheme:light}
html[data-theme=night]{--paper:#11141C;--lite:#1A1F2B;--ink:#E8ECF4;--gray:#A0A7B8;--or:#F25C1F;--on-or:#101522;--rust:#FF8A5C;--ok:#5BC46B;color-scheme:dark}
html[data-theme=felt]{--paper:#0F3B2D;--lite:#164A39;--ink:#F2EEDF;--gray:#B6C8BC;--or:#E3B94A;--on-or:#10261E;--rust:#FFB08A;--ok:#7BD88A;color-scheme:dark}
html[data-theme=blue]{--paper:#DCE6FA;--lite:#EEF3FD;--ink:#0E1B4D;--gray:#42507D;--or:#FF6A3D;--on-or:#0E1B4D;--rust:#A93200;--ok:#2E7D32}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs);background:var(--paper)}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--paper);color:var(--ink);font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer;border-radius:0}
::selection{background:var(--or);color:var(--ink)}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.mono{font-family:'Courier Prime','Courier New',monospace}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:calc(18px + env(safe-area-inset-top)) 20px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
h1,h2,h3,p{margin:0}
.lh{font-stretch:125%;font-weight:900;font-size:2.15rem;line-height:1;letter-spacing:-.01em;white-space:nowrap}
.sub{font-size:.95rem;font-weight:500;color:var(--gray);margin-top:6px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.stamp{margin-top:4px;padding:4px 8px;border:2px solid var(--rust);color:var(--rust);font-weight:800;font-size:.75rem;line-height:1.15;letter-spacing:.1em;text-transform:uppercase;text-align:center;transform:rotate(-6deg)}
.memo{border-top:2px solid var(--ink);padding-top:10px;font-family:'Courier Prime','Courier New',monospace;font-size:.82rem;line-height:1.55}
.memo div{display:flex;gap:10px}.memo b{flex:0 0 48px}
.cap{text-align:center;font-family:'Courier Prime','Courier New',monospace;font-size:.75rem;line-height:1.45;color:var(--gray)}
.lbl{display:block;font-family:'Courier Prime','Courier New',monospace;font-weight:700;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gray)}
.cell{border:2px solid var(--ink);background:var(--lite);padding:6px 12px 8px}
.cell:focus-within{box-shadow:0 0 0 3px rgba(242,92,31,.55)}
.cell input{display:block;width:100%;height:32px;padding:0;border:0;background:transparent;font-size:1.25rem;font-weight:500;outline:none}
input::placeholder{color:var(--gray)}
.btn{height:54px;border:2px solid var(--ink);background:transparent;font-weight:700;font-size:1rem;padding:0 14px;transition:transform .12s,filter .12s}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.4;cursor:default}
.pri{background:var(--or);color:var(--on-or);border-color:var(--ink);font-weight:800;font-size:1.1rem;letter-spacing:.01em}
.pri:hover:not([disabled]){filter:brightness(1.05)}
.dk{background:var(--ink);color:var(--lite)}
.row{display:flex;gap:10px;align-items:stretch}
.row .btn{white-space:nowrap;min-width:0}
.code{flex:0 0 112px;width:112px;min-width:0;height:52px;border:2px solid var(--ink);background:var(--lite);text-align:center;text-transform:uppercase;letter-spacing:.3em;font-family:'Courier Prime','Courier New',monospace;font-weight:700;font-size:1.1rem;border-radius:0;outline:none;padding:0 8px}
.code:focus{box-shadow:0 0 0 3px rgba(242,92,31,.55)}
.link{min-height:44px;padding:0 8px;background:none;border:0;color:var(--gray);font-weight:500;font-size:.9rem;text-decoration:underline;text-underline-offset:4px}
.chk{display:flex;gap:10px;align-items:center;min-height:44px;font-size:.9rem;font-weight:500;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--ink);margin:0;flex:0 0 22px}
.err{color:var(--rust);font-weight:700;font-size:.9rem}.err:empty{display:none}
.ver{margin-top:auto;display:flex;justify-content:center;align-items:center;gap:6px;font-family:'Courier Prime','Courier New',monospace;font-size:.72rem;color:var(--gray);padding-top:4px}
.cd{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.cd.wait{background:var(--or)}.cd.off{background:var(--rust)}
/* org chart */
.chart{width:100%;max-width:362px;margin:0 auto;display:flex;flex-direction:column}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.tier{display:grid;grid-template-columns:repeat(var(--k),1fr);column-gap:8px}
.tier.one{grid-template-columns:minmax(0,62%);justify-content:center}
.nd{min-height:40px;padding:4px 6px;border:2px solid var(--ink);background:var(--lite);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-width:0}
.nd .t{font-weight:700;font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;line-height:1.1}
.nd .n{font-family:'Courier Prime','Courier New',monospace;font-size:.82rem;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nd.pres{background:var(--ink);color:var(--lite)}
.nd.va{border-style:dashed;background:var(--paper)}
.nd.ass{border-style:dashed;border-color:var(--rust);color:var(--rust);background:var(--paper)}
.nd.me{box-shadow:0 0 0 3px var(--or)}
.lk{position:relative;height:var(--h,14px)}
.lk i{position:absolute;background:var(--ink);width:2px}
.lk i.h{height:2px;width:auto}
/* strip of players */
.strip{display:grid;grid-template-columns:repeat(var(--c),1fr);gap:6px}
.pn{border:2px solid var(--ink);background:var(--lite);padding:4px 5px 5px;min-width:0;text-align:center;position:relative}
.pn .pt{font-weight:800;font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;color:var(--gray);min-height:.8rem;line-height:1.1}
.pn .pnm{font-family:'Courier Prime','Courier New',monospace;font-weight:700;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn .pc{font-size:.72rem;font-weight:600;color:var(--gray);white-space:nowrap}
.pn.turn{background:var(--or);border-color:var(--ink);box-shadow:0 0 0 2px var(--ink);color:var(--on-or)}
.pn.turn .pt,.pn.turn .pc{color:var(--on-or)}
.pn .no{position:absolute;left:-7px;top:-9px;min-width:20px;height:20px;padding:0 4px;border-radius:10px;background:var(--ink);color:var(--paper);font-weight:800;font-size:.72rem;line-height:20px;text-align:center}
.pn.out{background:var(--paper);border-style:dashed}
.pn.away{opacity:.55}
.pn .ps{position:absolute;top:-8px;right:-4px;background:var(--ink);color:var(--lite);font-size:.6rem;font-weight:800;letter-spacing:.08em;padding:1px 4px;text-transform:uppercase}
/* table */
.pile{position:relative;width:100%;height:158px}
.pl{position:absolute;left:50%;top:30px;display:flex}
.pl .cd2+.cd2{margin-left:-24px}
.pl.old{filter:brightness(.92)}
.table{flex:1 1 auto;min-height:190px;border:2px solid var(--ink);background:var(--lite);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;text-align:center;position:relative}
.table .big{font-weight:800;font-size:1.05rem}
.table .hint{font-size:.85rem;color:var(--gray);font-weight:500}
.play{display:flex;justify-content:center;align-items:center}
.play .cd2{margin-left:-14px}
.play .cd2:first-child{margin-left:0}
.ghost{opacity:.5;transform:scale(.82)}
.who{font-family:'Courier Prime','Courier New',monospace;font-weight:700;font-size:.85rem}
.takes{position:absolute;top:8px;right:8px;padding:3px 8px;border:2px solid var(--rust);color:var(--rust);font-weight:800;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;transform:rotate(4deg);background:var(--lite)}
/* cards */
.cd2{position:relative;display:inline-flex;flex-direction:column;align-items:flex-start;width:62px;height:89px;padding:3px 4px;border:2px solid #101522;border-radius:5px;background:#FFFFFF;color:#101522;line-height:1;font-weight:800;text-align:left;box-shadow:0 1px 2px rgba(16,21,34,.25),0 4px 8px rgba(16,21,34,.12)}
.cd2.rd{color:var(--red)}
.cd2 .r{font-size:1.45rem;letter-spacing:-.02em}
.cd2 .s{font-size:1.1rem;margin-top:1px}
.cd2 .bg{position:absolute;right:5px;bottom:5px;font-size:1.8rem}
.cd2.lg{width:74px;height:106px}
.cd2.lg .r{font-size:1.75rem}.cd2.lg .s{font-size:1.2rem}.cd2.lg .bg{font-size:2.2rem}
button.cd2{padding:3px 4px}
.hand{display:flex;flex-wrap:wrap;justify-content:center;padding:0 12px 4px;min-height:96px}
.hand .cd2{margin:6px -14px 0;transition:transform .15s cubic-bezier(.2,.8,.2,1),box-shadow .15s}
.hand .cd2.sel{transform:translateY(-12px);box-shadow:0 0 0 3px var(--or),0 8px 12px rgba(0,0,0,.3);z-index:2}
.hand .cd2.dim{opacity:.4}
@keyframes drop{from{transform:translateY(-16px) scale(1.06);opacity:0}to{transform:none;opacity:1}}
.drop .cd2{animation:drop .24s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){.drop .cd2{animation:none}.hand .cd2{transition:none}}
.status{font-weight:800;font-size:1rem;text-align:center;min-height:1.3em}
.status small{font-weight:500;color:var(--gray);font-size:.85rem}
.acts{display:flex;gap:10px;position:sticky;bottom:0;background:var(--paper);padding:6px 0 4px;z-index:3}
@media (max-height:720px){
  #app{gap:8px;padding-top:calc(10px + env(safe-area-inset-top))}
  .table{min-height:84px;padding:6px;gap:4px}
  .pile{height:116px}.pl{top:14px}
  .cd2{width:50px;height:72px}.cd2.lg{width:58px;height:84px}.cd2 .r{font-size:1.1rem}.cd2.lg .r{font-size:1.3rem}.cd2 .bg{font-size:1.4rem}.cd2.lg .bg{font-size:1.6rem}
  .hand{min-height:76px}.hand .cd2{margin:5px -10px 0}
  .btn{height:48px}.lh{font-size:1.9rem}
  .chart .nd{min-height:32px}
}
@media (max-width:340px){.strip{gap:4px}.pn .pc{font-size:.66rem}.pn .pnm{font-size:.78rem}.cd2{width:48px;height:69px}.cd2.lg{width:56px;height:80px}.hand .cd2{margin:5px -11px 0}}
.acts .btn{flex:1}
.acts .pri{flex:2}
/* chat strip + topbar */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top .ttl{font-stretch:125%;font-weight:900;font-size:1.05rem}
.top .rd{font-family:'Courier Prime','Courier New',monospace;font-size:.8rem;color:var(--gray)}
.ib{min-width:44px;height:44px;border:2px solid var(--ink);background:var(--lite);font-weight:700;font-size:.8rem}
.chatstrip{min-height:44px;width:100%;border:2px solid var(--ink);background:var(--lite);padding:0 12px;display:flex;align-items:center;gap:8px;text-align:left;font-size:.85rem;overflow:hidden}
.chatstrip b{font-family:'Courier Prime','Courier New',monospace}
.chatstrip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.chatstrip .dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:var(--or)}
/* lobby / lists */
.sec{display:flex;flex-direction:column;gap:8px}
.codebox{border:2px solid var(--ink);background:var(--lite);padding:10px 12px;text-align:center;width:100%}
.codebox .c{font-family:'Courier Prime','Courier New',monospace;font-weight:700;font-size:2.6rem;letter-spacing:.3em;margin-right:-.3em;line-height:1.1}
.emp{display:flex;align-items:center;gap:10px;min-height:48px;border:2px solid var(--ink);background:var(--lite);padding:4px 10px}
.emp .nm{flex:1;min-width:0;font-family:'Courier Prime','Courier New',monospace;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.emp .tg{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gray)}
.emp.bot{border-style:dashed;background:var(--paper)}
.sel2{height:44px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);padding:0 6px;font-size:16px;font-weight:700;max-width:160px;border-radius:0}
.x{min-width:40px;height:40px;border:0;background:none;font-weight:800;font-size:1.1rem;color:var(--rust)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:40px;padding:0 12px;border:2px solid var(--ink);background:transparent;font-weight:700;font-size:.85rem}
.chip.on{background:var(--ink);color:var(--lite)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper .btn{height:44px;width:44px;padding:0;font-size:1.3rem}
.stepper .v{font-weight:800;font-size:1.2rem;min-width:2ch;text-align:center}
.note{font-size:.85rem;color:var(--gray);line-height:1.4}
.h2{font-stretch:125%;font-weight:900;font-size:1.5rem;line-height:1.05}
.verdict{border:3px double var(--ink);background:var(--lite);padding:16px 12px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.verdict .big{font-stretch:125%;font-weight:900;font-size:1.9rem;line-height:1.05;color:var(--rust);word-break:break-word}
table.tl{width:100%;border-collapse:collapse;font-size:.9rem}
table.tl th{font-family:'Courier Prime','Courier New',monospace;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;text-align:right;color:var(--gray);padding:4px 6px;border-bottom:2px solid var(--ink)}
table.tl th:first-child,table.tl td:first-child{text-align:left}
table.tl td{padding:7px 6px;text-align:right;border-bottom:1px dashed var(--gray);font-weight:600}
table.tl td:first-child{font-family:'Courier Prime','Courier New',monospace;font-weight:700;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* modal + toast */
#modal{position:fixed;inset:0;z-index:20;display:none;background:rgba(16,21,34,.55);align-items:flex-end;justify-content:center}
#modal.on{display:flex}
.sheet{width:100%;max-width:480px;max-height:88vh;max-height:88dvh;overflow:auto;background:var(--paper);border:2px solid var(--ink);border-bottom:0;padding:16px 20px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;box-shadow:0 -10px 30px rgba(0,0,0,.2)}
.sheet .hd{display:flex;justify-content:space-between;align-items:center}
.rules{padding-left:1.1rem;margin:0;display:flex;flex-direction:column;gap:7px;font-size:.92rem;line-height:1.4}
.log{display:flex;flex-direction:column;gap:6px;max-height:42vh;overflow:auto;font-size:.9rem}
.log .m b{font-family:'Courier Prime','Courier New',monospace}
.log .sys{color:var(--gray);font-style:italic}
.chin{display:flex;gap:8px}
.chin input{flex:1;height:48px;border:2px solid var(--ink);background:var(--lite);padding:0 10px;font-size:1rem;border-radius:0;outline:none}
#toast{position:fixed;left:0;right:0;bottom:calc(86px + env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none;z-index:30}
.toast{background:var(--ink);color:var(--lite);padding:10px 14px;font-weight:600;font-size:.9rem;max-width:86%;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<script src="engine.js"></script>
<script>
(function(){
'use strict';
var E=window.AEngine;
var DEMO=!!window.__DEMO;
var VER='v1 · Ishan Atul’s render';
var SIZES=['Normal','Large','Larger'];
var FS=[16,18,20];
var TIMERS=[0,30,45,60,120];
var LEVELS=[['easy','Easy'],['medium','Medium'],['hard','Hard']];
var TITLE=E.TITLE, SY=E.SUIT_SYM;
var ROLE_OPTS=[['citizen','Citizen'],['president','President'],['vp','Vice President'],['va','Vice Asshole'],['asshole','Asshole']];
function timerLabel(t){return !t?'Off':t<60?t+' s':(t/60)+' min'}

function $(s){return document.querySelector(s)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function load(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

var THEMES=[['paper','Paper'],['night','Night'],['felt','Felt'],['blue','Blue']];
var ui=Object.assign({fs:0,theme:'paper'},load('ah_ui',{}));
var snap=null,me=null,game=null,es=null,sess=load('ah_sess',null),isLocal=false;
var modal=null,errMsg='',sel=[],chatOpen=false,chatSeen=0,turnDeadline=null,animKey='',lastAnim='';
var savedName=load('ah_name','');
var busy=false;   // a create/join request is in flight: a second tap must not open a second room
var hName=savedName,hCode='',hRoles=false;
try{var qr=new URLSearchParams(location.search).get('r');if(qr)hCode=qr.toUpperCase().slice(0,4)}catch(e){}

function applyUI(){
  var h=document.documentElement;
  if(!THEMES.some(function(t){return t[0]===ui.theme}))ui.theme='paper';
  h.dataset.theme=ui.theme;h.style.setProperty('--fs',FS[ui.fs]+'px');
  var m=document.querySelector('meta[name=theme-color]'),bg=getComputedStyle(h).getPropertyValue('--paper').trim();
  if(m&&bg)m.setAttribute('content',bg);
  save('ah_ui',{fs:ui.fs,theme:ui.theme});
}
function toast(t){var el=$('#toast');el.innerHTML='<div class="toast">'+esc(t)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(function(){el.innerHTML=''},2600)}

/* ---------- transport (same connection handling as Judgement v1) ---------- */
function api(path,body){return fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json()})}
var seq=-1,lastSse=0,conn='ok',failN=0,pollT=null,rtt=null,syncing=false,lastTry=0;
function connText(){
  if(conn==='off')return 'Offline. Waiting for the network…';
  if(conn==='wait')return 'Reconnecting…';
  return 'Connected'+(rtt!=null?' · '+rtt+' ms'+(rtt>800?' (slow)':''):'');
}
function paintConn(){
  var d=$('#cd'),t=$('#ct'),c=$('#connst');
  if(d)d.className='cd '+conn;
  if(t)t.textContent=conn==='ok'?'':(conn==='off'?' Offline':' Reconnecting…');
  if(c)c.textContent=connText();
}
function setConn(v){if(conn!==v){conn=v;paintConn()}}
function verHTML(){return '<div class="ver">'+VER+'</div>'}
function pingNow(){
  if(isLocal||DEMO||!sess)return;
  var t0=performance.now();
  fetch('/api/ping',{cache:'no-store'}).then(function(r){return r.json()}).then(function(){rtt=Math.round(performance.now()-t0);paintConn()}).catch(function(){});
}
setInterval(function(){if(modal==='settings')pingNow()},5000);
function onSnap(s){
  if(!isLocal&&!sess)return;
  if(!isLocal&&s.seq!=null&&s.seq<=seq)return;
  if(s.seq!=null)seq=s.seq;
  var mine=s.hand||[];
  sel=sel.filter(function(c){return mine.indexOf(c)>=0});
  var myTurn=(s.phase==='playing'&&s.turn===s.me)||(s.phase==='exchange'&&s.give);
  if(!myTurn)sel=[];
  turnDeadline=s.turnLeft==null?null:Date.now()+s.turnLeft;
  snap=s;
  render();
  if(modal==='chat')paintChat();
}
function roomGone(){
  if(es){es.close();es=null}
  stopPoll();sess=null;save('ah_sess',null);snap=null;modal=null;seq=-1;sel=[];
  closeModal();toast('That table is no longer available');render();
}
function resync(){
  if(!sess||isLocal||syncing)return;
  syncing=true;
  fetch('/api/state?code='+sess.code+'&token='+sess.token,{cache:'no-store'})
    .then(function(r){return r.json().then(function(j){return{st:r.status,j:j}})})
    .then(function(x){
      syncing=false;
      if(x.st===404){roomGone();return}
      if(x.j&&x.j.s){setConn('ok');onSnap(x.j.s)}
    }).catch(function(){syncing=false;setConn(navigator.onLine===false?'off':'wait')});
}
function startPoll(){if(!pollT)pollT=setInterval(resync,1500)}
function stopPoll(){if(pollT){clearInterval(pollT);pollT=null}}
function connect(){
  if(es){try{es.close()}catch(e){}es=null}
  if(!sess)return;
  var my=es=new EventSource('/api/stream?code='+sess.code+'&token='+sess.token);
  var alive=function(){if(es!==my)return false;failN=0;lastSse=Date.now();stopPoll();setConn('ok');return true};
  my.onopen=alive;
  my.onmessage=function(e){if(alive())onSnap(JSON.parse(e.data))};
  my.addEventListener('hb',function(e){
    if(!alive())return;
    try{var d=JSON.parse(e.data);if(d.seq!=null&&d.seq>seq)resync()}catch(x){}
  });
  my.addEventListener('removed',function(){
    if(es!==my)return;
    my.close();es=null;stopPoll();sess=null;save('ah_sess',null);snap=null;seq=-1;sel=[];closeModal();toast('You were removed from the table');render();
  });
  my.onerror=function(){
    if(es!==my)return;
    failN++;setConn(navigator.onLine===false?'off':'wait');
    if(my.readyState===2){es=null;resync()}
    if(failN>=3)startPoll();
  };
}
// the server sends a heartbeat every 10 s; silence for 25 s means the stream is dead
setInterval(function(){
  if(!sess||isLocal||!snap)return;
  if(Date.now()-lastSse>25000){
    setConn(navigator.onLine===false?'off':'wait');startPoll();
    if(Date.now()-lastTry>10000){lastTry=Date.now();connect();resync()}
  }
},4000);
function wake(){
  if(!sess||isLocal)return;
  resync();
  if(!es||es.readyState!==1||Date.now()-lastSse>15000)connect();
}
document.addEventListener('visibilitychange',function(){if(!document.hidden)wake()});
window.addEventListener('online',function(){setConn('wait');wake()});
window.addEventListener('offline',function(){setConn('off')});
window.addEventListener('pageshow',function(e){if(e.persisted)wake()});
function act(a){
  if(isLocal){var r=game.act(me,a);if(r&&r.err)toast(r.err);return}
  var mine=sess;
  api('/api/act',{code:sess.code,token:sess.token,a:a}).then(function(r){
    if(r&&r.err){
      if(r.err==='Not your turn'||r.err==='Not now'){resync();return}
      toast(r.err);return
    }
    if(sess!==mine)return;
    if(r&&r.s){onSnap(r.s);if(modal==='settings')openModal('settings')}
  }).catch(function(){toast('Connection problem');setTimeout(resync,800)});
}
function enter(r){sess={code:r.code,token:r.token};save('ah_sess',sess);me=r.pid;seq=-1;connect()}
function readHome(){var n=$('#nm'),c=$('#rc'),r=$('#rl');if(n)hName=n.value;if(c)hCode=c.value.toUpperCase();if(r)hRoles=r.checked}
function create(){
  readHome();var n=hName.trim();
  if(!n){errMsg='Enter your name to continue';render();return}
  savedName=n;save('ah_name',n);
  if(DEMO){startDemo(n);return}
  if(busy)return;busy=true;
  api('/api/create',{name:n,roles:hRoles}).then(function(r){busy=false;if(r.err){errMsg=r.err;render();return}errMsg='';enter(r)}).catch(function(){busy=false;errMsg='Could not reach the server';render()});
}
function join(){
  readHome();var n=hName.trim(),c=hCode.trim().toUpperCase();
  if(!n){errMsg='Enter your name to continue';render();return}
  if(!c){errMsg='Enter a room code to join';render();return}
  savedName=n;save('ah_name',n);
  if(DEMO){errMsg='The demo has no live tables. Use Start a table.';render();return}
  if(busy)return;busy=true;
  api('/api/join',{code:c,name:n}).then(function(r){busy=false;if(r.err){errMsg=r.err;render();return}errMsg='';enter(r)}).catch(function(){busy=false;errMsg='Could not reach the server';render()});
}
/* demo: the whole game runs in this page against bots */
function startDemo(n){
  isLocal=true;game=new E.Game('DEMO');game.autoMs=700;
  var r=game.addHuman(n,'demo');me=r.pid;game.size=5;
  if(hRoles)game.act(me,{type:'roles',on:true});
  game.onChange=function(){
    game.humans().forEach(function(p){p.connected=true});
    game.schedule();
    onSnap(game.snapshot(me));
  };
  game.onChange();
}
function leave(){
  if(DEMO){location.reload();return}
  if(isLocal){game.destroy();game=null;isLocal=false}
  else{act({type:'leave'});if(es){es.close();es=null}stopPoll();sess=null;seq=-1;save('ah_sess',null)}
  snap=null;sel=[];closeModal();render();
}
function tryRejoin(){
  if(!sess)return;
  api('/api/rejoin',sess).then(function(r){if(r.err){sess=null;save('ah_sess',null);render();return}me=r.pid;connect()}).catch(function(){});
}

/* ---------- helpers ---------- */
function player(id){return snap.players.filter(function(p){return p.id===id})[0]}
function nameOf(id){var p=player(id);return p?p.name:'?'}
function isRed(c){var s=E.suitOf(c);return s==='H'||s==='D'}
function amHost(){return snap&&snap.host===snap.me}
function lastChatId(){return snap&&snap.chat&&snap.chat.length?snap.chat[snap.chat.length-1].id:0}
function plural(n,w){return n+' '+w+(n===1?'':'s')}

function cardHTML(c,o){
  o=o||{};
  var r=E.rankLabel(E.rankOf(c)),s=SY[E.suitOf(c)];
  var cls='cd2'+(isRed(c)?' rd':'')+(o.sel?' sel':'')+(o.dim?' dim':'')+(o.lg?' lg':'');
  var inner='<span class="r">'+r+'</span><span class="s">'+s+'</span><span class="bg">'+s+'</span>';
  if(o.btn)return '<button class="'+cls+'" data-a="card" data-c="'+c+'" aria-pressed="'+(o.sel?'true':'false')+'" aria-label="'+r+' of '+E.SUIT_NAME[E.suitOf(c)]+'">'+inner+'</button>';
  return '<span class="'+cls+'" role="img" aria-label="'+r+' of '+E.SUIT_NAME[E.suitOf(c)]+'">'+inner+'</span>';

/* org chart. tiers: [{k:'pres'|'vp'|'cit'|'va'|'ass', nodes:[{t,n,me}]}] */
function bus(k,dir){
  var h='<div class="lk" style="--h:14px">',i;
  if(k>1){
    h+='<i class="h" style="'+(dir==='in'?'bottom:0':'top:0')+';left:'+(50/k)+'%;right:'+(50/k)+'%"></i>';
    for(i=0;i<k;i++)h+='<i style="left:calc('+((i+.5)*100/k)+'% - 1px);top:0;bottom:0"></i>';
  }else h+='<i style="left:calc(50% - 1px);top:0;bottom:0"></i>';
  return h+'</div>';
}
function chartHTML(tiers){
  var h='<div class="chart">';
  tiers.forEach(function(t,ti){
    if(ti){
      var up=tiers[ti-1].nodes.length,dn=t.nodes.length;
      h+=(up===1&&dn===1)?'<div class="lk" style="--h:16px"><i style="left:calc(50% - 1px);top:0;bottom:0"></i></div>':bus(up,'in')+bus(dn,'out');
    }
    var k=t.nodes.length;
    h+='<div class="tier'+(k===1?' one':'')+'" style="--k:'+k+'">';
    t.nodes.forEach(function(x){
      h+='<div class="nd '+t.k+(x.me?' me':'')+'"><span class="t">'+esc(x.t)+'</span>'+(x.n!=null?'<span class="n">'+esc(x.n)+'</span>':'')+'</div>';
    });
    h+='</div>';
  });
  return h+'</div>';
}
function staticTiers(){
  // the front page always shows the full hierarchy; in a game the chart follows the number of players
  return [{k:'pres',nodes:[{t:'President'}]},{k:'vp',nodes:[{t:'Vice President'}]},
    {k:'cit',nodes:[{t:'Citizen'},{t:'Citizen'},{t:'Citizen'}]},{k:'va',nodes:[{t:'Vice Asshole'}]},{k:'ass',nodes:[{t:'Asshole'}]}];
}
function namedTiers(order,meId){
  var n=order.length,ts=E.titlesFor(n),tiers=[],map={president:'pres',vp:'vp',citizen:'cit',va:'va',asshole:'ass'};
  order.forEach(function(pid,i){
    var k=map[ts[i]],last=tiers[tiers.length-1],node={t:TITLE[ts[i]],n:nameOf(pid),me:pid===meId};
    if(last&&last.k===k)last.nodes.push(node);else tiers.push({k:k,nodes:[node]});
  });
  return tiers;
}

// 1, 2, 3 … is the order of play this trick, starting with whoever leads it and going round the table past anyone who is out
function orderNums(s){
  var m={};
  if(s.phase!=='playing')return m;
  var lead=s.trick&&s.trick.lead!=null?s.trick.lead:s.turn;
  var li=-1;s.players.forEach(function(p,i){if(p.id===lead)li=i});
  if(li<0)return m;
  var k=0;
  for(var i=0;i<s.players.length;i++){var p=s.players[(li+i)%s.players.length];if(p.cards>0&&!p.out)m[p.id]=++k}
  return m;
}
function stripHTML(s){
  var c=Math.min(4,s.players.length);
  var h='<div class="strip" style="--c:'+c+'">';
  var num=orderNums(s),ts=E.titlesFor(s.n);
  s.players.forEach(function(p){
    var cls='pn'+(s.turn===p.id?' turn':'')+(p.out?' out':'')+(p.id===s.me?' me':'')+(!p.connected&&!p.bot?' away':'');
    // someone who is out already holds this round's title for their finishing place; the rest show last round's
    var title=p.out?TITLE[ts[p.out-1]]:(p.title?TITLE[p.title]:'');
    var info=(p.id===s.me?'you · ':'')+(p.out?('out #'+p.out):(p.cards+(p.cards===1?' card':' cards')+(!p.connected&&!p.bot?' · away':'')));
    h+='<div class="'+cls+'">'+(num[p.id]?'<span class="no" title="Order of play">'+num[p.id]+'</span>':'')+(p.passed&&!p.out?'<span class="ps">Pass</span>':'')+'<div class="pt">'+esc(title)+'</div><div class="pnm">'+esc(p.name)+'</div><div class="pc">'+info+'</div></div>';
  });
  return h+'</div>';
}

// The plays of this trick stacked like a pile: the latest on top, the ones before it peeking out underneath
var PILE_X=[0,-42,40,-76,74],PILE_Y=[0,-11,-8,-20,-17],PILE_R=[0,-6,5,-10,8];
function pileHTML(plays,fresh){
  var vis=plays.slice(-5),n=vis.length,h='<div class="pile">';
  vis.forEach(function(pl,i){
    var d=n-1-i;
    h+='<div class="pl'+(d===0&&fresh?' drop':'')+(d?' old':'')+'" style="z-index:'+(i+1)+';transform:translate(calc(-50% + '+PILE_X[d]+'px),'+PILE_Y[d]+'px) rotate('+PILE_R[d]+'deg)">'
      +pl.cards.map(function(c){return cardHTML(c,{lg:1})}).join('')+'</div>';
  });
  return h+'</div>';
}
function tableHTML(s){
  var h='<div class="table" aria-live="polite">';
  if(s.phase==='exchange'){
    if(s.give){var to=nameOf(s.give.to);h+='<div class="big">Hand down '+plural(s.give.k,'card')+'</div><div class="hint">You got '+esc(to)+'’s best cards. Pick '+s.give.k+' of yours to give back.</div>'}
    else{var w=s.pending.length?nameOf(s.pending[0].hi):'';h+='<div class="big">Hand-downs</div><div class="hint">Waiting for '+esc(w)+' to hand down cards. The lowest titles already gave up their best.</div>'}
    return h+'</div>';
  }
  var tr=s.trick;
  if(tr&&tr.plays.length){
    var last=tr.plays[tr.plays.length-1],prev=tr.plays.length>1?tr.plays[tr.plays.length-2]:null;
    var key=s.round+':'+tr.plays.length+':'+last.pid;
    var fresh=key!==lastAnim;lastAnim=key;
    if(s.phase==='trickdone'){
      h+='<span class="takes">'+(s.roundEnds?'Round over':esc(nameOf(s.trickWinner))+' takes it')+'</span>';
    }
    h+=pileHTML(tr.plays,fresh);
    h+='<div class="who">'+esc(nameOf(last.pid))+(last.pid===s.me?' (you)':'')+' played '+plural(last.cards.length,'card')+'</div>';
    if(s.phase==='playing'&&s.turn===s.me)h+='<div class="hint">Beat it with '+plural(tr.count,'card')+' higher than '+E.rankLabel(tr.rank)+', or pass.</div>';
    else if(s.phase==='playing')h+='<div class="hint">Next up: '+esc(nameOf(s.turn))+'</div>';
  }else{
    lastAnim='';
    var lead=s.turn!=null?nameOf(s.turn):'';
    h+='<div class="big">'+(s.turn===s.me?'You lead':esc(lead)+' leads')+'</div><div class="hint">'+(s.turn===s.me?'Play one card, or a set of the same rank.':'Nothing on the table yet.')+'</div>';
  }
  return h+'</div>';
}

function trickReq(s){return s.trick?{count:s.trick.count,rank:s.trick.rank}:null}
function canUse(s,c){
  if(s.phase==='exchange')return !!s.give;
  if(s.phase!=='playing'||s.turn!==s.me)return false;
  var tr=trickReq(s);if(!tr)return true;
  var r=E.rankOf(c);if(r<=tr.rank)return false;
  return s.hand.filter(function(x){return E.rankOf(x)===r}).length>=tr.count;
}
function tapCard(c){
  var s=snap;if(!s||!canUse(s,c))return;
  var i=sel.indexOf(c);
  if(s.phase==='exchange'){
    if(i>=0)sel.splice(i,1);else if(sel.length<s.give.k)sel.push(c);else {sel.shift();sel.push(c)}
    render();return;
  }
  var tr=trickReq(s),r=E.rankOf(c);
  if(i>=0){sel=tr&&tr.count>1?[]:sel.filter(function(x){return x!==c})}
  else{
    if(sel.length&&E.rankOf(sel[0])!==r)sel=[];
    if(tr&&tr.count>1){
      var same=s.hand.filter(function(x){return E.rankOf(x)===r&&x!==c});
      sel=[c].concat(same).slice(0,tr.count);
    }else if(tr)sel=[c];
    else sel.push(c);
  }
  render();
}

function gameHTML(s){
  var h=topBar(s)+stripHTML(s)+tableHTML(s);
  var last=s.chat.length?s.chat[s.chat.length-1]:null,unread=last&&last.id>chatSeen;
  h+='<button class="chatstrip" data-a="chat" aria-label="Open chat">'+(unread?'<span class="dot"></span>':'')+(last?(last.sys?'<span><i>'+esc(last.text)+'</i></span>':'<span><b>'+esc(last.name)+':</b> '+esc(last.text)+'</span>'):'<span style="color:var(--gray)">Say something to the table…</span>')+'</button>';
  var myTurn=s.phase==='playing'&&s.turn===s.me,give=s.phase==='exchange'&&s.give;
  var st;
  if(give)st='Choose '+plural(give.k,'card')+' to hand down <small>('+sel.length+' picked)</small>';
  else if(myTurn)st='Your turn'+(turnDeadline?' <small id="tm"></small>':'');
  else if(s.phase==='playing')st='<small>Waiting for '+esc(nameOf(s.turn))+(turnDeadline?' <span id="tm"></span>':'')+'</small>';
  else st='<small>&nbsp;</small>';
  var meP=player(s.me);
  if(meP&&meP.out&&s.phase!=='exchange')st='You are out: '+TITLE[E.titlesFor(s.n)[meP.out-1]]+' <small>watch the rest play</small>';
  h+='<div class="status">'+st+'</div>';
  h+='<div class="hand" role="group" aria-label="Your hand">'+s.hand.map(function(c){
    var on=canUse(s,c);
    return cardHTML(c,{btn:1,sel:sel.indexOf(c)>=0,dim:(myTurn||give)&&!on});
  }).join('')+'</div>';
  if(give){
    h+='<div class="acts"><button class="btn pri" data-a="give"'+(sel.length===give.k?'':' disabled')+'>Hand down '+plural(give.k,'card')+'</button></div>';
  }else{
    var bad=sel.length?E.playError(sel,trickReq(s)):'x';
    h+='<div class="acts">'+(s.trick?'<button class="btn" data-a="pass"'+(myTurn?'':' disabled')+'>Pass</button>':'')+'<button class="btn pri" data-a="play"'+(myTurn&&!bad?'':' disabled')+'>'+(sel.length?'Play '+sel.map(E.cardLabel).join(' '):'Play')+'</button></div>';
  }
  return h;
}

function roundHTML(s){
  var host=amHost(),over=s.phase==='gameover';
  var h=topBar(s);
  if(over){
    var v=s.verdict||{asshole:[],president:[]};
    var names=function(ids){return ids.map(nameOf).join(' & ')};
    h+='<div class="verdict"><div class="lbl">Final memo</div><div>Asshole of the night</div><div class="big">'+esc(names(v.asshole)||'Nobody')+'</div>'
      +(v.president.length&&v.president.length<s.players.length?'<div class="note">Most Presidencies: '+esc(names(v.president))+'</div>':'')+'</div>';
  }else{
    h+='<div class="h2">Memo: restructuring</div><p class="note">Round '+s.round+' is done. New titles, effective immediately.</p>';
  }
  if(s.order)h+=chartHTML(namedTiers(s.order,s.me));
  h+='<table class="tl"><thead><tr><th>Name</th><th>Pres</th><th>Ass</th><th>Rounds</th></tr></thead><tbody>'
    +s.players.slice().sort(function(a,b){return b.tally.president-a.tally.president||a.tally.asshole-b.tally.asshole}).map(function(p){return '<tr><td>'+esc(p.name)+'</td><td>'+p.tally.president+'</td><td>'+p.tally.asshole+'</td><td>'+p.tally.rounds+'</td></tr>'}).join('')+'</tbody></table>';
  if(over){
    h+=host?'<button class="btn pri" data-a="again">Back to the lobby</button>':'<div class="note">Waiting for the host to reset the table.</div>';
    h+='<button class="btn" data-a="leave">Leave table</button>';
  }else{
    h+='<button class="btn pri" data-a="next">Deal round '+(s.round+1)+'</button>';
    if(host)h+='<button class="btn" data-a="finish">End the night</button>';
  }
  return h;
}

function render(){
  var a=$('#app');
  if(!a)return;
  var st=a.scrollTop;
  if(!snap)a.innerHTML=homeHTML();
  else if(snap.phase==='lobby')a.innerHTML=lobbyHTML(snap);
  else if(snap.phase==='roundover'||snap.phase==='gameover')a.innerHTML=roundHTML(snap);
  else a.innerHTML=gameHTML(snap);
  paintConn();paintTimer();
}
function paintTimer(){
  var el=$('#tm');if(!el||turnDeadline==null)return;
  var s=Math.max(0,Math.ceil((turnDeadline-Date.now())/1000));
  el.textContent=Math.floor(s/60)+':'+('0'+s%60).slice(-2);
}
setInterval(paintTimer,500);

/* ---------- modals ---------- */
function openModal(kind){
  modal=kind;var m=$('#modal'),h='';
  if(kind==='rules'){
    h='<div class="sheet" role="dialog" aria-label="How to play"><div class="hd"><div class="h2">How to play</div><button class="ib" data-a="close" aria-label="Close">×</button></div>'
    +'<ul class="rules"><li>3 to 8 players, bots fill empty seats. Everyone is dealt the whole deck. The 2 is the highest card, then Ace, King down to 3.</li>'
    +'<li>The 3 of clubs starts the first round. Lead one card or a set of the same rank (pairs, three, four).</li>'
    +'<li>Each player then beats it with the same number of cards of a higher rank, or passes. When everyone else passes, the last to play takes the trick and leads.</li>'
    +'<li>A 2 can’t be beaten, so it ends the trick at once.</li>'
    +'<li>First out is President, last with cards is the Asshole, everyone in between is a Citizen. With 7 or 8 players the second out is Vice President and the second last is Vice Asshole.</li>'
    +'<li>When someone goes out and wins the trick, the next player round the table leads. Small numbers next to the names show the order of play.</li>'
    +'<li>Next round the Asshole gives the President their 2 best cards and the President hands back any 2 (1 card with 3 players). From 7 players the vices swap 1 card too.</li>'
    +'<li>The Asshole leads the next round. Host: tick “Start with roles” in the lobby to carry on a game with the titles you pick.</li></ul></div>';
  }else if(kind==='settings'&&snap){
    var host=amHost();
    h='<div class="sheet" role="dialog" aria-label="Settings"><div class="hd"><div class="h2">Settings</div><button class="ib" data-a="close" aria-label="Close">×</button></div>'
    +'<div class="cell"><label class="lbl" for="rn">Your name</label><input id="rn" maxlength="16" value="'+esc(player(snap.me).name)+'"></div><button class="btn" data-a="rename">Save name</button>'
    +'<div class="sec"><div class="lbl">Theme</div><div class="chips">'+THEMES.map(function(t){return '<button class="chip'+(ui.theme===t[0]?' on':'')+'" data-a="theme" data-v="'+t[0]+'">'+t[1]+'</button>'}).join('')+'</div></div>'
    +'<div class="sec"><div class="lbl">Text size</div><div class="chips">'+SIZES.map(function(x,i){return '<button class="chip'+(ui.fs===i?' on':'')+'" data-a="fs" data-i="'+i+'">'+x+'</button>'}).join('')+'</div></div>';
    if(host){
      h+='<div class="sec"><div class="lbl">Bot level</div><div class="chips">'+LEVELS.map(function(l){return '<button class="chip'+(snap.botLevel===l[0]?' on':'')+'" data-a="level" data-v="'+l[0]+'">'+l[1]+'</button>'}).join('')+'</div></div>'
      +'<div class="sec"><div class="lbl">Turn timer</div><div class="chips">'+TIMERS.map(function(t){return '<button class="chip'+(snap.timerSec===t?' on':'')+'" data-a="timer" data-v="'+t+'">'+timerLabel(t)+'</button>'}).join('')+'</div></div>';
    }
    h+='<div class="note" id="connst">'+esc(connText())+'</div>';
    if(host&&snap.phase!=='lobby')h+='<div class="sec"><div class="lbl">Remove a player (a bot takes the seat)</div><div class="chips">'+snap.players.filter(function(p){return !p.bot&&p.id!==snap.me}).map(function(p){return '<button class="chip" data-a="kick" data-p="'+p.id+'">'+esc(p.name)+'</button>'}).join('')+'</div></div>';
    h+='<button class="btn" style="color:var(--rust);border-color:var(--rust)" data-a="leave">Leave table</button></div>';
    pingNow();
  }else if(kind==='chat'&&snap){
    chatSeen=lastChatId();
    h='<div class="sheet" role="dialog" aria-label="Chat"><div class="hd"><div class="h2">Table talk</div><button class="ib" data-a="close" aria-label="Close">×</button></div><div class="log" id="log"></div>'
    +'<div class="chin"><input id="ci" maxlength="160" placeholder="Say something" autocomplete="off"><button class="btn dk" style="height:48px" data-a="send">Send</button></div></div>';
  }
  m.innerHTML=h;m.classList.add('on');
  if(kind==='chat'){paintChat()}
}
function paintChat(){
  var l=$('#log');if(!l||!snap)return;
  var near=l.scrollHeight-l.scrollTop-l.clientHeight<40;
  l.innerHTML=snap.chat.map(function(m){return m.sys?'<div class="m sys">'+esc(m.text)+'</div>':'<div class="m"><b>'+esc(m.name)+':</b> '+esc(m.text)+'</div>'}).join('')||'<div class="note">No messages yet.</div>';
  if(near||true)l.scrollTop=l.scrollHeight;
  chatSeen=lastChatId();
}
function closeModal(){modal=null;var m=$('#modal');m.classList.remove('on');m.innerHTML='';render()}
$('#modal').addEventListener('click',function(e){if(e.target===this)closeModal()});

/* ---------- events ---------- */
function onAct(el){
  var a=el.dataset.a;
  switch(a){
    case 'create':return create();
    case 'join':return join();
    case 'rules':return openModal('rules');
    case 'settings':return openModal('settings');
    case 'chat':return openModal('chat');
    case 'close':return closeModal();
    case 'card':return tapCard(el.dataset.c);
    case 'play':if(sel.length){var c=sel.slice();sel=[];act({type:'play',cards:c});render()}return;
    case 'pass':sel=[];return act({type:'pass'});
    case 'give':if(snap.give&&sel.length===snap.give.k){var g=sel.slice();sel=[];act({type:'give',cards:g})}return;
    case 'start':return act({type:'start'});
    case 'next':return act({type:'next'});
    case 'finish':return act({type:'finish'});
    case 'again':return act({type:'again'});
    case 'size':return act({type:'size',size:snap.n+(+el.dataset.d)});
    case 'kick':return act({type:'kick',pid:+el.dataset.p});
    case 'level':return act({type:'level',level:el.dataset.v});
    case 'timer':return act({type:'timer',sec:+el.dataset.v});
    case 'fs':ui.fs=+el.dataset.i;applyUI();return openModal('settings');
    case 'theme':ui.theme=el.dataset.v;applyUI();return openModal('settings');
    case 'rename':var n=$('#rn').value;if(n.trim()){savedName=n.trim();save('ah_name',savedName);act({type:'rename',name:n})}return closeModal();
    case 'send':var ci=$('#ci');if(ci&&ci.value.trim()){act({type:'chat',text:ci.value});ci.value='';ci.focus()}return;
    case 'leave':return leave();
    case 'copy':
      var link=location.origin+'/?r='+snap.code;
      if(navigator.clipboard&&navigator.clipboard.writeText&&location.protocol!=='file:')navigator.clipboard.writeText(link).then(function(){toast('Invite link copied')},function(){toast('Room code: '+snap.code)});
      else toast('Room code: '+snap.code);
      return;
  }
}
document.addEventListener('click',function(e){var el=e.target.closest('[data-a]');if(el&&el.tagName!=='INPUT')onAct(el)});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.a==='rolesmode')return act({type:'roles',on:t.checked});
  if(t.dataset&&t.dataset.role)return act({type:'setrole',pid:+t.dataset.role,role:t.value});
  if(t.id==='rl')hRoles=t.checked;
});
document.addEventListener('input',function(e){var t=e.target;if(t.id==='nm')hName=t.value;if(t.id==='rc')hCode=t.value.toUpperCase()});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  var t=e.target;
  if(t.id==='nm')create();
  else if(t.id==='rc')join();
  else if(t.id==='ci')onAct({dataset:{a:'send'}});
});

applyUI();
render();
if(sess&&!DEMO)tryRejoin();
window.__ah={snap:function(){return snap},game:function(){return game}};
})();
</script>
</body>
</html>
